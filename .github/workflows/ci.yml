name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Run release contract tests
        run: bun run test:release-contract
      - run: bun run lint
      - run: bun run scripts/scan-secrets.ts
      - name: Installer contract (stubbed download, no network)
        run: sh apps/web/test/install.test.sh
      - run: bun run --cwd apps/app build
      - run: bun run --cwd apps/web build
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'macos-latest'
      - name: Desktop shell tests
        if: matrix.os == 'macos-latest'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Clean tree (a build must not change tracked files)
        run: git diff --exit-code --stat
