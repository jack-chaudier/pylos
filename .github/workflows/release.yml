name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev libfuse2 file
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Build sidecar (kernel + server, single binary)
        run: PYLOS_TARGET_TRIPLE=${{ matrix.target }} bun run --cwd packages/server build:sidecar
      - name: Build desktop (macOS)
        if: runner.os == 'macOS'
        run: bun run --cwd apps/desktop tauri build --bundles dmg --target ${{ matrix.target }}
      - name: Build desktop (Linux deb)
        if: runner.os == 'Linux'
        run: bun run --cwd apps/desktop tauri build --bundles deb --target ${{ matrix.target }}
      - name: Build desktop (Linux AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun run --cwd apps/desktop tauri build --bundles appimage --target ${{ matrix.target }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          # headless server/CLI binary (kernel + server in one file) for install.sh
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) plat=macos; arch=arm64 ;;
            x86_64-apple-darwin) plat=macos; arch=x64 ;;
            x86_64-unknown-linux-gnu) plat=linux; arch=x64 ;;
            *) plat=unknown; arch=unknown ;;
          esac
          mkdir -p stage && cp apps/desktop/src-tauri/binaries/pylos-server-${{ matrix.target }} stage/pylos && chmod +x stage/pylos
          tar -C stage -czf out/pylos-$plat-$arch.tar.gz pylos
          find apps/desktop/src-tauri/target -path '*bundle*' \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          cd out && for f in *; do n="$(echo "$f" | sed -E 's/^Pylos_?/pylos-/; s/_aarch64|_amd64|_x86_64//')"; [ "$f" = "$n" ] || mv "$f" "$n"; done; ls -la; shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          generate_release_notes: true
