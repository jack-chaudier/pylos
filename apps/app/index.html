<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="apple-touch-icon" href="./favicon-192.png" />
    <link rel="preload" href="./fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/courier-prime-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/geist-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pylos</title>
  </head>
  <body>
    <noscript>
      <main
        aria-labelledby="javascript-required-title"
        style="max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; font: 16px/1.6 system-ui, sans-serif"
      >
        <p style="font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase">Pylos</p>
        <h1 id="javascript-required-title">The conversation needs JavaScript to open.</h1>
        <p>
          This page is the Pylos shell. Enable JavaScript and reload to use the composer, receipts, and the
          proof thread.
        </p>
        <h2>Running Pylos locally?</h2>
        <ol>
          <li>Start the local server with <code>pylos serve</code>.</li>
          <li>
            Reload this page at <a href="http://127.0.0.1:7334/app/">127.0.0.1:7334/app/</a> once it is
            running.
          </li>
          <li>
            You can check the server directly at <a href="http://127.0.0.1:7334/api/health">/api/health</a>.
          </li>
        </ol>
        <p>
          The interactive proof thread is opened from the Pylos home screen and demonstrates correction,
          coverage, deletion, and attachment evidence.
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
